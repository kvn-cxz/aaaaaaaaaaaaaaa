
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lector QR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>
  <h1>Lector de códigos QR</h1>

  
<section class="panel">
  <h2>Iniciar sesión</h2>

  <label for="email">Correo electrónico:</label>
  <input
      type="email"
      id="email"
      placeholder="Tu correo de Supabase"
      autocomplete="username"
  >

  <label for="password">Contraseña:</label>
  <input
      type="password"
      id="password"
      placeholder="Tu contraseña"
      autocomplete="current-password"
  >

  <button id="login">Iniciar sesión</button>
  <button id="logout" disabled>Cerrar sesión</button>

  <p id="authStatus">Inicia sesión para conectar el inventario.</p>

  <div id="reader"></div>

  <button id="start" disabled>Activar cámara</button>
  <button id="stop" disabled>Detener cámara</button>
  
  <p id="status">Inicia sesión para activar la cámara.</p>

</section>


  
<section class="panel">
  <h2>Equipo escaneado</h2>

  <p id="detected">Todavía no hay lecturas.</p>
  <p id="saveStatus"></p>

  <form id="equipoForm">
    <label for="codigoEquipo">Código QR:</label>
    <input id="codigoEquipo" type="text" readonly required>

    <label for="descripcion">Descripción:</label>
    <input id="descripcion" type="text" placeholder="Ej. Silla de oficina">

    <label for="tipo">Tipo de equipo:</label>
    <input id="tipo" type="text" placeholder="Ej. Mobiliario">

    <label for="edificio">Código del edificio:</label>
    <input id="edificio" type="text">

    <label for="nombre_edificio">Nombre del edificio:</label>
    <input id="nombre_edificio" type="text">

    <label for="salon">Salón:</label>
    <input id="salon" type="text">

    <label for="usuario">Usuario responsable:</label>
    <input id="usuario" type="text">

    <label for="estado">Estado:</label>
    <select id="estado">
      <option value="">Seleccionar estado</option>
      <option value="En uso">En uso</option>
      <option value="Disponible">Disponible</option>
      <option value="En reparación">En reparación</option>
      <option value="Baja">Baja</option>
    </select>

    <label for="observaciones">Observaciones:</label>
    <textarea id="observaciones" rows="3"></textarea>

    <button id="guardarEquipo" type="submit" disabled>
      Guardar equipo
    </button>
  </form>
</section>


  <section class="panel">
    <h2>Historial (<span id="count">0</span>)</h2>
    <div id="history"></div>

    <button id="download">Descargar CSV para Excel</button>
    <button id="clear">Limpiar historial</button>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
