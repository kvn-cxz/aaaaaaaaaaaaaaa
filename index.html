
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lector QR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>
  <h1>Lector de códigos QR</h1>

  
<section class="panel">
  <h2>Iniciar sesión</h2>

  <label for="email">Correo electrónico:</label>
  <input
      type="email"
      id="email"
      placeholder="Tu correo de Supabase"
      autocomplete="username"
  >

  <label for="password">Contraseña:</label>
  <input
      type="password"
      id="password"
      placeholder="Tu contraseña"
      autocomplete="current-password"
  >

  <button id="login">Iniciar sesión</button>
  <button id="logout" disabled>Cerrar sesión</button>

  <p id="authStatus">Inicia sesión para conectar el inventario.</p>

  <div id="reader"></div>
</section>


  <section class="panel">
    <h2>Última lectura</h2>
    <p id="detected">Todavía no hay lecturas.</p>
    <p id="saveStatus"></p>
  </section>

  <section class="panel">
    <h2>Historial (<span id="count">0</span>)</h2>
    <div id="history"></div>

    <button id="download">Descargar CSV para Excel</button>
    <button id="clear">Limpiar historial</button>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
