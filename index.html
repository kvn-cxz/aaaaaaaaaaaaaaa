
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lector QR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>
  <h1>Lector de códigos QR</h1>

  <section class="panel">
    <label for="token">Clave de conexión con Excel:</label>
    <input
        type="password"
        id="token"
        placeholder="Introduce tu QR_TOKEN"
        autocomplete="off"
    >

    <div id="reader"></div>

    <button id="start">Activar cámara</button>
    <button id="stop" disabled>Detener cámara</button>

    <p id="status">Pulsa «Activar cámara» para comenzar.</p>
  </section>

  <section class="panel">
    <h2>Última lectura</h2>
    <p id="detected">Todavía no hay lecturas.</p>
    <p id="saveStatus"></p>
  </section>

  <section class="panel">
    <h2>Historial (<span id="count">0</span>)</h2>
    <div id="history"></div>

    <button id="download">Descargar CSV para Excel</button>
    <button id="clear">Limpiar historial</button>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
