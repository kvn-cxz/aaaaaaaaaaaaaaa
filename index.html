
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lector QR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>
  <h1>Lector de códigos QR</h1>

  <section class="panel">
    <div id="reader"></div>

    <button id="start">Activar cámara</button>
    <button id="stop" disabled>Detener cámara</button>

    <p id="status">Pulsa «Activar cámara» para comenzar.</p>
  </section>

  <section class="panel">
    <h2>Última lectura</h2>
    <p id="detected">Todavía no hay lecturas.</p>
    <p id="saveStatus"></p>
  </section>

  <section class="panel">
    <h2>Historial (<span id="count">0</span>)</h2>
    <div id="history"></div>

    <button id="download">Descargar CSV para Excel</button>
    <button id="clear">Limpiar historial</button>
  </section>

  <script>
    const reader = new Html5Qrcode("reader");

    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const status = document.getElementById("status");
    const detected = document.getElementById("detected");
    const history = document.getElementById("history");
    const count = document.getElementById("count");
    const saveStatus = document.getElementById("saveStatus");

    let running = false;
    let records = [];
    let lastCode = null;
    let unlockTimer = null;

    // Reinicia la detección cuando el QR deja de verse.
    function scheduleUnlock() {
      clearTimeout(unlockTimer);
      unlockTimer = setTimeout(() => {
        lastCode = null;
      }, 1200);
    }

    function addRecord(text) {
      // Evita registrar repetidamente el mismo QR
      // mientras continúa delante de la cámara.
      if (text === lastCode) {
        scheduleUnlock();
        return;
      }

      lastCode = text;
      scheduleUnlock();

      const record = {
        number: records.length + 1,
        text: text,
        date: new Date().toLocaleString("es-MX")
      };

      records.push(record);

      detected.textContent = text;
      saveStatus.textContent =
        "Lectura agregada al historial de esta sesión.";

      const item = document.createElement("div");
      item.className = "record";

      const value = document.createElement("strong");
      value.textContent = record.number + ". " + record.text;

      const date = document.createElement("small");
      date.textContent = record.date;

      item.append(value, date);
      history.prepend(item);

      count.textContent = records.length;
    }

    startBtn.addEventListener("click", async () => {
      if (running) return;

      startBtn.disabled = true;
      status.textContent = "Solicitando acceso a la cámara...";

      try {
        await reader.start(
          { facingMode: "environment" },
          {
            fps: 12,
            qrbox: (width, height) => {
              const size = Math.floor(
                Math.min(width, height) * 0.7
              );
              return { width: size, height: size };
            }
          },
          (decodedText) => addRecord(decodedText),
          () => {}
        );

        running = true;
        stopBtn.disabled = false;
        status.textContent =
          "Cámara activa. Apunta al siguiente código QR.";
      } catch (error) {
        status.textContent =
          "No se pudo abrir la cámara. Comprueba los permisos y que uses HTTPS.";
        startBtn.disabled = false;
      }
    });

    stopBtn.addEventListener("click", async () => {
      if (!running) return;

      try {
        await reader.stop();
        running = false;
        clearTimeout(unlockTimer);

        startBtn.disabled = false;
        stopBtn.disabled = true;
        status.textContent = "Cámara detenida.";
      } catch (error) {
        status.textContent =
          "No se pudo detener la cámara correctamente.";
      }
    });

    // CSV compatible con Excel.
    function csvCell(value) {
      let text = String(value);

      // Evita que un contenido QR se interprete como fórmula.
      if (/^[\s]*[=+\-@]/.test(text)) {
        text = "'" + text;
      }

      return '"' + text.replace(/"/g, '""') + '"';
    }

    document.getElementById("download")
      .addEventListener("click", () => {
        const rows = [
          ["Número", "Texto QR", "Fecha y hora"],
          ...records.map(r => [r.number, r.text, r.date])
        ];

        const csv = "\uFEFF" +
          rows.map(row => row.map(csvCell).join(",")).join("\r\n");

        const blob = new Blob([csv], {
          type: "text/csv;charset=utf-8;"
        });

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");

        a.href = url;
        a.download = "registro_qr.csv";
        a.click();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });

    document.getElementById("clear")
      .addEventListener("click", () => {
        if (!confirm("¿Borrar el historial de esta sesión?")) return;

        records = [];
        history.replaceChildren();
        count.textContent = "0";
        detected.textContent = "Todavía no hay lecturas.";
        saveStatus.textContent = "";
        lastCode = null;
      });
  </script>
</body>
</html>
